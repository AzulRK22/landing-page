name: Update language learning snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: update-language-learning
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh public snapshot
        env:
          DUO_PROFILE: ${{ vars.DUO_PROFILE }}
        run: node scripts/update-language-learning.mjs

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- assets/data/language-learning.json; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/language-learning.json
          git commit -m "chore: update language learning snapshot"
          git push
